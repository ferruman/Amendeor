providers:
  editor:
    transport: openai
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: AMENDEOR_OPENROUTER_API_KEY
    family: openai
    price:
      input_per_m: 0.10
      output_per_m: 0.50
      currency: USD
  verifier:
    transport: openai
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: AMENDEOR_OPENROUTER_API_KEY
    family: claude
    price:
      input_per_m: 0.10
      output_per_m: 0.50
      currency: USD
profiles:
  edit:
    provider: editor
    model: openai/gpt-6-luna
    context_budget: 2048
  # Проход по всей книге (check --guide book): книга целиком в одном запросе и рассуждение — так он измерен в eval/book-pass.
  book:
    provider: editor
    model: openai/gpt-6-luna
    reasoning: true
    reasoning_effort: medium
  verify:
    provider: verifier
    model: anthropic/claude-haiku-5.5
    reasoning: true
    reasoning_effort: medium
    passes: 3
    check: necessity
