providers:
  editor:
    transport: openai
    endpoint: https://openrouter.ai/api/v1/chat/completions
    api_key_env: AMENDEOR_OPENROUTER_API_KEY
    family: openai
    price:
      input_per_m: 1.25
      output_per_m: 10
      currency: USD
  verifier:
    transport: anthropic
    endpoint: https://openrouter.ai/api/v1/messages
    api_key_env: AMENDEOR_OPENROUTER_API_KEY
    family: claude
    price:
      input_per_m: 2
      output_per_m: 10
      currency: USD
profiles:
  edit:
    provider: editor
    model: openai/gpt-5.1
    context_budget: 2048
  verify:
    provider: verifier
    model: anthropic/claude-sonnet-5
    passes: 3
